[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adoptionkit"
version = "0.0.1.dev0"
description = "Evidence-based adoption of an AI solution in an organisation: schema, lints, gates, viewer, skill"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hayal Özkan" }]
keywords = ["ai-adoption", "evidence", "gates", "public-administration", "claude", "skill"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = ["pydantic>=2.6", "typer>=0.12", "pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.3", "pyright>=1.1.380", "types-PyYAML", "types-jsonschema"]

[project.scripts]
adoptionkit = "adoptionkit.cli:main"

[project.urls]
Homepage = "https://github.com/malkreide/adoptionkit"
Issues = "https://github.com/malkreide/adoptionkit/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adoptionkit = ["schema/*.json", "profiles/*.yaml", "templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
