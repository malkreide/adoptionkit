name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check ruff pin
        run: python scripts/check_ruff_pin.py
      - name: Ruff
        run: ruff check .
      - name: Pyright
        run: pyright
      - name: Pytest
        run: pytest
      - name: Validate example
        run: adoptionkit validate examples/synthetic-municipality/engagement.json
      - name: Lint example
        run: adoptionkit lint examples/synthetic-municipality/engagement.json
      - name: Render viewer
        run: adoptionkit view examples/synthetic-municipality/engagement.json -o out.html
